<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="description"
      content="Libro Hespérides: libro y archivo personal, gratuito, instalable y local-first." />
    <!-- El link del manifiesto lo inyecta vite-plugin-pwa en el build. -->
    <title>LegeLearning | Libro Hespérides</title>
    <!--
      TEMA ANTES DEL PRIMER PINTADO.

      Aplica la preferencia guardada (claro / oscuro / sistema) antes de que el navegador
      pinte nada, para que arrancar en oscuro no dé un destello blanco. Va en línea y sin
      dependencias a propósito: cualquier módulo llegaría tarde. La lógica «de verdad» vive
      en `src/ui/tema.ts`; esto es solo su reflejo mínimo, con la misma clave.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hesperides.tema')
          var oscuro =
            t === 'oscuro' ||
            (t !== 'claro' &&
              typeof matchMedia === 'function' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', oscuro)
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', oscuro ? '#0c0a09' : '#fafaf9')
        } catch (e) {
          /* Sin localStorage (modo privado): se queda el tema claro por defecto. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
